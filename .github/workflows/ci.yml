name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Bind test checkout to the advertised PR merge result
        if: github.event_name == 'pull_request'
        env:
          EXPECTED_BASE: ${{ github.event.pull_request.base.sha }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD^1)" = "$EXPECTED_BASE"
          test "$(git rev-parse HEAD^2)" = "$EXPECTED_HEAD"
      - name: Install agent frontmatter parser
        run: python3 -m pip install PyYAML==6.0.3
      - name: Fixed dispatcher validation, lifetime, continuation, and cleanup
        run: python3 .github/test-dispatch.py
      - name: Current review packets, publication, and round cap
        run: python3 .github/test-review-packet.py
      - name: Hard-edge negative probes and constructed rebases
        env:
          HARD_EDGE_SHARD: rest
        run: python3 .github/test-hard-edges.py
      - name: Claude-native agent definitions carry the role sources
        run: python3 .github/check-agents.py
      - name: Agent carrier gate refuses mismatched effort and helper models
        run: python3 .github/test-agents.py
      - name: Complete role delivery and overflow fallback
        run: python3 .github/test-session-start.py
      - name: Every shipped artifact arrives whole through its declared handlers
        run: python3 .github/check-core-budget.py
      - name: No @path references (they force-load context)
        run: |
          ! grep -rn "@[a-zA-Z0-9_-]*/" reference/ --include='*.md' \
            | grep -v "actions/" | grep -v "anthropic" | grep .
      - name: Every ADR amendment block is announced by its status line
        run: python3 .github/check-adr-index.py
      - name: Release manifest versions stay in lockstep
        run: |
          python3 - <<'EOF'
          import json
          p = json.load(open('.claude-plugin/plugin.json'))['version']
          m = json.load(open('.claude-plugin/marketplace.json'))['plugins'][0]['version']
          assert p == m, f'Claude plugin={p} marketplace={m}'
          print('versions in lockstep:', p)
          EOF

      - name: Machine-readable page contracts and retired artifact checks
        run: |
          set -e
          # This asserts only DevStandard's documentation path shape; semantic admission remains merge check 1.
          python3 - <<'PY'
          import pathlib,re,subprocess

          paths=subprocess.check_output(["git","ls-files","-z"]).decode().rstrip("\0").split("\0")
          markdown=[p for p in paths if pathlib.PurePosixPath(p).suffix.lower()==".md"]
          candidates=[p for p in markdown if "/" not in p or p.split("/",1)[0].casefold()=="docs"]
          root={"README.md","CLAUDE.md"}
          allowed=[]
          rejected=[]
          for path in candidates:
              ok=(
                  ("/" not in path and path in root)
                  or path in {"docs/PRD.md","docs/architecture.md"}
                  or re.fullmatch(r"docs/adr/\d{4}-[^/]+\.md",path)
                  or re.fullmatch(r"docs/specs/\d{4}-\d{2}-\d{2}-[^/]+\.md",path)
                  or re.fullmatch(r"docs/architecture/[^/]+\.md",path)
              )
              (allowed if ok else rejected).append(path)
          assert not rejected, f"non-canonical documentation paths: {rejected}"
          folded={}
          for path in allowed:
              folded.setdefault(path.casefold(),[]).append(path)
          duplicates=[group for group in folded.values() if len(group)>1]
          assert not duplicates, f"case-folded documentation path collisions: {duplicates}"

          predicate=pathlib.Path("reference/in-repo-writes.md").read_text().splitlines()
          start="<!-- BEGIN IN-REPO-WRITES PREDICATE -->"
          end_re=re.compile(r"<!-- END IN-REPO-WRITES PREDICATE \((\d+) payload lines\) -->")
          starts=[i for i,line in enumerate(predicate) if line==start]
          ends=[(i,end_re.fullmatch(line)) for i,line in enumerate(predicate) if end_re.fullmatch(line)]
          assert len(starts)==1 and len(ends)==1, "predicate block must have exactly one start and one counted end marker"
          begin=starts[0]
          end,match=ends[0]
          assert begin<end, "predicate block markers are reversed"
          actual=end-begin-1
          declared=int(match.group(1))
          assert actual==declared, f"predicate block declares {declared} payload lines, found {actual}"
          print(f"documentation paths canonical; predicate block {actual} payload lines")
          PY
          # retirement asserted, not assumed
          test ! -e .devstandard || { echo ".devstandard survives"; exit 1; }
          test ! -e scripts/codex-adopt || { echo "codex-adopt survives"; exit 1; }
          test ! -e AGENTS.md || { echo "managed AGENTS.md survives"; exit 1; }
          grep -qxF "/.claude/worktrees/" .gitignore || { echo "worktree ignore line missing"; exit 1; }
          # Only the anchored rows and their cell form are read by scripts/dispatch.
          # Human prose, including arbitration examples and single-site model guidance,
          # is judged by the reviewer reading the diff.
          python3 - <<'PY'
          import re
          page="reference/orchestrator.md"
          t=open(page).read()
          rows=re.findall(r"^\| (worker|reviewer) \| `([^`|]+)` at `([^`|]+)` \| `([^`|]+)` at `([^`|]+)` \|$", t, re.M)
          assert [r[0] for r in rows]==["worker","reviewer"], f"anchored rows: want one machine-readable row per role, got {rows}"
          print("anchored settings: one machine-readable row per role")
          PY
          # per-ADR 0039 presence
          for a in 0006 0007 0008 0015 0016 0018 0019 0024 0038; do
            grep -l "Amended by 0039 (2026-08-26)" docs/adr/${a}-*.md >/dev/null || { echo "ADR $a missing 0039 status entry"; exit 1; }
            grep -l "see 0039" docs/adr/${a}-*.md >/dev/null || { echo "ADR $a missing 0039 block"; exit 1; }
          done
          # Claude Code is the only host (ADR 0063): no Codex host carrier survives.
          # Assert what git tracks, not what the filesystem holds: a Codex-dispatched worker's
          # sandbox mounts a read-only empty tmpfs at <worktree>/.agents, so a path-existence
          # test failed every local run inside a Codex lane while the path was never a
          # repository artifact at all (#480). A *committed* retired carrier still fails.
          test -z "$(git ls-files .codex-plugin)" || { echo ".codex-plugin survives"; exit 1; }
          test -z "$(git ls-files .agents)" || { echo "Codex repository marketplace survives"; exit 1; }
          test -z "$(git ls-files skills/devstandard)" || { echo "Codex recovery skill survives"; exit 1; }
          grep -q 'BEGIN CODEX WORKER MECHANICS' reference/harness-codex.md
          echo "static assertions OK"

  sweep:
    name: sweep (${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Bind sweep checkout to the advertised PR merge result
        if: github.event_name == 'pull_request'
        env:
          EXPECTED_BASE: ${{ github.event.pull_request.base.sha }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD^1)" = "$EXPECTED_BASE"
          test "$(git rev-parse HEAD^2)" = "$EXPECTED_HEAD"
      - name: Role word-list sweep across every position, role, and tool format
        env:
          HARD_EDGE_SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
        run: python3 .github/test-hard-edges.py

  codex:
    name: Codex (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Bind test checkout to the advertised PR merge result
        if: github.event_name == 'pull_request'
        env:
          EXPECTED_BASE: ${{ github.event.pull_request.base.sha }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD^1)" = "$EXPECTED_BASE"
          test "$(git rev-parse HEAD^2)" = "$EXPECTED_HEAD"
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install Linux sandbox prerequisites
        if: runner.os == 'Linux'
        run: |
          # https://learn.chatgpt.com/docs/sandboxing#prerequisites
          # A scoped bwrap profile preserves the global user-namespace restriction.
          sudo apt-get update
          sudo apt-get install -y bubblewrap apparmor-profiles apparmor-utils
          sudo install -m 0644 /usr/share/apparmor/extra-profiles/bwrap-userns-restrict /etc/apparmor.d/bwrap-userns-restrict
          sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict
          bwrap --unshare-user --unshare-net --ro-bind / / /bin/true
      - name: Install the qualified Codex CLI
        run: |
          npm install --prefix "$RUNNER_TEMP/devstandard-codex" @openai/codex@0.156.1
          echo "$RUNNER_TEMP/devstandard-codex/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Hook delivery on this runner's own bash
        run: python3 .github/test-session-start.py
      - name: Real Codex CLI executor with a local deterministic provider
        run: python3 .github/test-codex-runtime.py --log-dir "$RUNNER_TEMP/devstandard-inline"
      - name: Detached process and review publication regression
        run: |
          python3 .github/test-dispatch.py
          python3 .github/test-review-packet.py
      - name: Preserve runtime failure evidence in the job log
        if: failure()
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'devstandard-inline'
          for path in sorted(root.rglob('*')):
              if path.is_file():
                  print(f'--- inline/{path.relative_to(root)} ---')
                  print(path.read_text())
          PY

  claude:
    name: Claude (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Bind test checkout to the advertised PR merge result
        if: github.event_name == 'pull_request'
        env:
          EXPECTED_BASE: ${{ github.event.pull_request.base.sha }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD^1)" = "$EXPECTED_BASE"
          test "$(git rev-parse HEAD^2)" = "$EXPECTED_HEAD"
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install the server-qualified Claude Code CLI
        run: |
          npm install --prefix "$RUNNER_TEMP/devstandard-claude" @anthropic-ai/claude-code@2.1.268
          echo "$RUNNER_TEMP/devstandard-claude/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Real Claude plugin, native Agent and CLI role hooks
        run: python3 .github/test-claude-runtime.py --dispatch-cli --log-dir "$RUNNER_TEMP/devstandard-claude-runtime"
      - name: Preserve Claude runtime failure evidence
        if: failure()
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'devstandard-claude-runtime'
          for path in sorted(root.glob('*')):
              if path.is_file() and path.name.endswith(('.stdout.jsonl', '.stderr.log',
                  'summary.json', 'dispatch-cli.process.log', 'dispatch-cli.output.jsonl', 'dispatch-cli.exit-code')):
                  print(f'--- {path.name} ---')
                  print(path.read_text()[-20000:])
          PY

  # Preserve the branch-protection context; every dependency must actually pass.
  test:
    if: ${{ always() }}
    needs: [suite, sweep, codex, claude]
    runs-on: ubuntu-latest
    steps:
      - name: Require the ordinary suite and every sweep shard
        env:
          SUITE_RESULT: ${{ needs.suite.result }}
          SWEEP_RESULT: ${{ needs.sweep.result }}
          CODEX_RESULT: ${{ needs.codex.result }}
          CLAUDE_RESULT: ${{ needs.claude.result }}
        run: |
          test "$SUITE_RESULT" = success
          test "$SWEEP_RESULT" = success
          test "$CODEX_RESULT" = success
          test "$CLAUDE_RESULT" = success

  merged-result:
    name: merged-result / ${{ github.event.pull_request.base.sha }} / ${{ github.event.pull_request.head.sha }}
    if: github.event_name == 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Report that this exact merge result passed the test job
        env:
          TEST_RESULT: ${{ needs.test.result }}
        run: test "$TEST_RESULT" = success
